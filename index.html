<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scorepad Futé</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#222">
</head>
<body>
    <header>
        <div class="header-left">
            <h1>Assistant Scorepad</h1>
            <button id="undo-btn" class="icon-btn" title="Annuler" disabled>↩️</button>
        </div>
        <div class="round-tracker">
            <button id="prev-round" class="round-btn">◀</button>
            <span id="round-display">Tour: 1 / 6</span>
            <button id="next-round" class="round-btn">▶</button>
        </div>
        <button id="reset-btn">Nouvelle Partie</button>
    </header>

    <main>
        <!-- Scores Summary -->
        <div class="scores-bar">
            <div class="score-box silver-score">⬜ <span id="s-score">0</span></div>
            <div class="score-box yellow-score">🟨 <span id="y-score">0</span></div>
            <div class="score-box blue-score">🟦 <span id="b-score">0</span></div>
            <div class="score-box green-score">🟩 <span id="g-score">0</span></div>
            <div class="score-box pink-score">🟪 <span id="p-score">0</span></div>
            <div class="score-box fox-score">🦊 <span id="f-count">0</span>x<span id="f-min">0</span> = <span id="f-score">0</span></div>
            <div class="score-box total-score-box">Total: <span id="total-score">0</span></div>
        </div>

        <!-- Action Trackers -->
        <div class="trackers-container">
            <div class="tracker-group">
                <span class="tracker-icon">🔄</span>
                <div class="tracker-circles" id="tracker-reroll"></div>
            </div>
            <div class="tracker-group">
                <span class="tracker-icon">🔙</span>
                <div class="tracker-circles" id="tracker-return"></div>
            </div>
            <div class="tracker-group">
                <span class="tracker-icon">➕1</span>
                <div class="tracker-circles" id="tracker-plus1"></div>
            </div>
        </div>

        <div class="zones-container">

            <div class="top-zones-wrapper">
                <!-- Silver Zone -->
                <div class="zone silver-zone">
                                        <div class="silver-bonuses">
                        <span class="bonus-label-top clickable-bonus" data-bid="s-c-0">+1</span><span class="bonus-label-top badge-y clickable-bonus" data-bid="s-c-1">?</span><span class="fox-badge clickable-bonus" data-bid="s-c-2">🦊</span><span class="bonus-label-top badge-b clickable-bonus" data-bid="s-c-3">?</span><span class="bonus-label-top badge-g clickable-bonus" data-bid="s-c-4">?</span><span class="bonus-label-top badge-p clickable-bonus" data-bid="s-c-5">?</span>
                    </div>
                    <div class="silver-grid"></div>
                    <div class="silver-scores">
                        <div class="score-pair"><span class="cross-count">1</span><span class="star-label">2</span></div>
                        <div class="score-pair"><span class="cross-count">2</span><span class="star-label">4</span></div>
                        <div class="score-pair"><span class="cross-count">3</span><span class="star-label">7</span></div>
                        <div class="score-pair"><span class="cross-count">4</span><span class="star-label">11</span></div>
                        <div class="score-pair"><span class="cross-count">5</span><span class="star-label">16</span></div>
                        <div class="score-pair"><span class="cross-count">6</span><span class="star-label">22</span></div>
                    </div>
                </div>

                <!-- Yellow Zone -->
                <div class="zone yellow-zone">
                    <div class="yellow-scores">
                        <div class="score-pair"><span class="cross-count">1</span><span class="star-label">3</span></div>
                        <div class="score-pair"><span class="cross-count">2</span><span class="star-label">10</span></div>
                        <div class="score-pair"><span class="cross-count">3</span><span class="star-label">21</span></div>
                        <div class="score-pair"><span class="cross-count">4</span><span class="star-label">36</span></div>
                        <div class="score-pair"><span class="cross-count">5</span><span class="star-label">55</span></div>
                        <div class="score-pair"><span class="cross-count">6</span><span class="star-label">75</span></div>
                        <div class="score-pair"><span class="cross-count">7</span><span class="star-label">96</span></div>
                        <div class="score-pair"><span class="cross-count">8</span><span class="star-label">118</span></div>
                        <div class="score-pair"><span class="cross-count">9</span><span class="star-label">141</span></div>
                        <div class="score-pair"><span class="cross-count">10</span><span class="star-label">165</span></div>
                    </div>
                    <div class="yellow-grid-wrapper">
                        <div class="yellow-grid"></div>
                                                <div class="yellow-row-bonuses">
                            <span class="badge-b clickable-bonus" data-bid="y-r-0">?</span><span class="fox-badge clickable-bonus" data-bid="y-r-1">🔙</span><span class="badge-y clickable-bonus" data-bid="y-r-2">?</span><span class="badge-g clickable-bonus" data-bid="y-r-3">?</span><span class="badge-p clickable-bonus" data-bid="y-r-4">?</span>
                        </div>
                    </div>
                                        <div class="yellow-col-bonuses">
                        <span class="fox-badge clickable-bonus" data-bid="y-c-0">🔄</span><span class="fox-badge clickable-bonus" data-bid="y-c-1">+1</span><span class="badge-s clickable-bonus" data-bid="y-c-2">?</span><span class="fox-badge clickable-bonus" data-bid="y-c-3">🦊</span>
                    </div>
                </div>
            </div>

            <!-- Blue Zone -->
            <div class="zone blue-zone">
                <div class="track blue-track"></div>
            </div>

            <!-- Green Zone -->
            <div class="zone green-zone">
                <div class="track green-track"></div>
            </div>

            <!-- Pink Zone -->
            <div class="zone pink-zone">
                <div class="track pink-track"></div>
            </div>
        </div>
    </main>

    <!-- Modal Numpad -->
    <div id="numpad-modal" class="modal hidden">
        <div class="numpad">
            <div class="numpad-header">Saisir une valeur</div>
            <div class="numpad-grid">
                <button class="num-btn" data-val="1">1</button>
                <button class="num-btn" data-val="2">2</button>
                <button class="num-btn" data-val="3">3</button>
                <button class="num-btn" data-val="4">4</button>
                <button class="num-btn" data-val="5">5</button>
                <button class="num-btn" data-val="6">6</button>
                <button class="num-btn" data-val="7">7</button>
                <button class="num-btn" data-val="8">8</button>
                <button class="num-btn" data-val="9">9</button>
                <button class="num-btn" data-val="10">10</button>
                <button class="num-btn" data-val="11">11</button>
                <button class="num-btn" data-val="12">12</button>
            </div>
            <button id="cancel-btn">Annuler</button>
            <button id="clear-btn">Effacer</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
